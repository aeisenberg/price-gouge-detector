name: Weekly Price Gouge Check

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  contents: write

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # Use --force because there's a conflict between eslint 10 and
        # typescript-eslint 8 that causes npm ci to fail. This is a
        # temporary workaround until we can resolve the version conflict.
        run: npm ci --force

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      - name: Run price gouge detector
        id: detect
        run: |
          set -o pipefail
          node dist/index.js 2>&1 | tee output.txt

      - name: Generate summary and create issue
        if: always()
        uses: actions/github-script@v7
        id: generate-summary
        with:
          script: |
            const fs = require('fs');

            const output = fs.readFileSync('output.txt', 'utf-8');
            const date = new Date().toISOString().split('T')[0];

            // Read augmented deals data if available
            let deals = [];
            let gouges = [];
            try {
              deals = JSON.parse(fs.readFileSync('data/weekly-deals.json', 'utf-8'));
              gouges = deals.filter(d => d.isPriceGouge);
            } catch {
              // Data file may not exist if scraping failed
            }

            // Build markdown summary
            let summary = `## 🔍 Price Gouge Detector — ${date}\n\n`;

            if (gouges.length > 0) {
              summary += `### ⚠️ ${gouges.length} Potential Price Gouge(s) Detected\n\n`;
              summary += `| Product | ID | Sale Price | Max Historical | Avg Historical | Diff |\n`;
              summary += `|---|---|---|---|---|---|\n`;
              for (const g of gouges) {
                const diff = (g.salePrice - g.maxHistoricalPrice).toFixed(2);
                const ctLink = g.canadianTireUrl ? `[CT](${g.canadianTireUrl})` : '';
                const tsLink = g.tirespyUrl ? `[TireSpy](${g.tirespyUrl})` : '';
                const links = [ctLink, tsLink].filter(Boolean).join(' · ');
                summary += `| ${g.productName.substring(0, 60)} ${links} | ${g.productId} | $${g.salePrice.toFixed(2)} | $${g.maxHistoricalPrice.toFixed(2)} | $${g.averageHistoricalPrice.toFixed(2)} | +$${diff} |\n`;
                g.links = links;
              }
              summary += `\n`;
              for (const g of gouges) {
                const ctLink = g.canadianTireUrl ? `- [Canadian Tire](${g.canadianTireUrl})` : '';
                const tsLink = g.tirespyUrl ? `- [TireSpy](${g.tirespyUrl})` : '';
                summary += `**${g.productName}** (${g.productId})\n${ctLink}\n${tsLink}\n\n`;
              }
            } else if (deals.length > 0) {
              summary += `### ✅ No Price Gouges Detected\n\nAll ${deals.length} sale prices are at or below their historical maximum.\n\n`;
            }

            summary += `### 📊 Summary\n\n`;
            summary += `- **Total deals scanned**: ${deals.length}\n`;
            summary += `- **Price gouges found**: ${gouges.length}\n\n`;

            // Also include the lowerHistoricalPrices
            if (gouges.length > 0) {
              summary += `\n### 🔍 Historical Prices Below Current Sale Price\n\n`;
              for (const g of gouges) {
                if (g.lowerHistoricalPrices && g.lowerHistoricalPrices.length > 0) {
                  summary += `**${g.productName}** (${g.productId}) had the following historical prices below the current sale price of $${g.salePrice.toFixed(2)} ${g.links}:\n\n`;
                  for (const hp of g.lowerHistoricalPrices) {
                    summary += `- $${hp.price.toFixed(2)} on ${new Date(hp.date).toLocaleDateString()}\n`;
                  }
                  summary += `\n`;
                }
              }
            }

            // Write to workflow summary
            await core.summary.addRaw(summary).write();

            // Create GitHub issue
            const issueTitle = gouges.length > 0
              ? `⚠️ ${gouges.length} price gouge(s) detected — ${date}`
              : `✅ No price gouges — ${date}`;

            // Capture the issue number for later use
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: summary,
              labels: ['price-check']
            });
            core.setOutput('issueNumber', issue.data.number);

      - name: Compress the data files and add it to a release.
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.generate-summary.outputs.issueNumber }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "price-data-${{ steps.generate-summary.outputs.issueNumber }}"
        run: |
          if [ ! -d "data" ]; then
            echo "No data directory found, skipping release creation."
            exit 0
          fi

          zip -r price-data.zip data/
          # tag the release with the issue number for easy reference
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git tag "$TAG_NAME" -m "Price data for issue #$ISSUE_NUMBER"
          git push origin "$TAG_NAME"
          gh release create "$TAG_NAME" price-data.zip --title "Price Data for Issue #$ISSUE_NUMBER"

          # Add a comment to the issue that points to the release with the data
          gh issue comment $ISSUE_NUMBER --body "📁 The price data for this issue has been archived in a release: [Price Data for Issue #$ISSUE_NUMBER](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME)"
